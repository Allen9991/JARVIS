name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ts-ignore usage
        run: |
          if rg "// @ts-ignore" --glob "!**/*.md" --glob "!node_modules/**"; then
            echo "::error::Use typed code or @ts-expect-error with an explanatory comment instead of // @ts-ignore."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff
        run: uv run --extra dev ruff check .

      - name: Mypy
        run: uv run --extra dev mypy --strict .

      - name: Pytest
        run: uv run --extra dev pytest
